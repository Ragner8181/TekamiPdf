async function rcp(p){const w=window.open('','_blank'),r=await sb.storage.from('receipts').createSignedUrl(p,3600);if(r.error){w&&w.close();return toast(r.error.message)}w.location=r.data.signedUrl}
async function setP(id,s){const r=await sb.from('payments').update({status:s}).eq('id',id);if(r.error)return toast(r.error.message);toast(t('done'));loadAdmin()}
function usrTab(){return AD.users.length?AD.users.map(u=>`<div class="row"><div><b>${e(u.name)}</b><small>${e(u.email)}</small></div><small>${t('regAt')}:<br>${fmt(u.created_at)}</small></div>`).join(''):`<div class="empty">${t('none')}</div>`}
function addTab(){const E=BK.find(x=>x.id===V.edit)||{},F=V.f||E,k=V.kind||E.kind||'book',p=k==='product';
return `<div class="box wide" style="margin-top:0"><h2>${V.edit?t('edit'):t('addNew')}</h2><label>${t('kind')}</label><select id="kd" onchange="V.f=readF();V.kind=this.value;render()">${[['book','kindBook'],['course','kindCourse'],['product','kindProduct']].map(x=>`<option value="${x[0]}" ${k===x[0]?'selected':''}>${t(x[1])}</option>`).join('')}</select>
<label>${p?t('pName'):k==='course'?t('cTitle'):t('title')}</label><input id="ti" value="${e(F.title)}">${p?'':`<label>${t('bname')}</label><input id="bn" value="${e(F.name)}">`}
<label>${t('desc')}</label><textarea id="ds" rows="4">${e(F.description)}</textarea><label>${t('price')} (${t('birr')})</label><input id="pc" type="number" min="0" value="${e(F.price)}">
<label>${p?t('pPhoto'):t('cover')}${V.edit?` — ${t('keep')}`:''}</label><input id="cv" type="file" accept="image/*">${p?'':`<label>${t('pdf')}${V.edit?` — ${t('keep')}`:''}</label><input id="pf" type="file" accept=".pdf,application/pdf">`}
<div class="act"><button class="btn" onclick="save()">${V.edit?t('save'):t('publish')}</button>${V.edit?`<button class="btn o" onclick="V.edit=null;V.f=null;V.kind=null;render()">${t('cancel')}</button>`:''}</div></div>
<h2 style="margin-top:30px">${t('manage')}</h2>${BK.length?BK.map(b=>`<div class="row"><div style="display:flex;gap:12px"><div class="thumb" style="background-image:url('${e(pub(b.cover_path))}')"></div><div><b>${e(b.title)}</b><small>${t({book:'kindBook',course:'kindCourse',product:'kindProduct'}[kd(b)])} · ${Number(b.price).toLocaleString()} ${t('birr')}</small></div></div><div class="act"><button class="btn o s" onclick="V.edit='${b.id}';V.f=null;V.kind=null;render();scrollTo(0,0)">${t('edit')}</button><button class="btn r s" onclick="delB('${b.id}')">${t('del')}</button></div></div>`).join(''):`<div class="empty">${t('none')}</div>`}`}
async function save(){const E=BK.find(x=>x.id===V.edit),k=$('kd').value,f=readF(),cv=$('cv').files[0],pf=$('pf')?$('pf').files[0]:null,p=k==='product';
if(!f.title||!f.description||!f.price||(!p&&!f.name))return toast(t('fill'));if(!E&&(!cv||(!p&&!pf)))return toast(t('fill'));
const data={kind:k,title:f.title,name:p?f.title:f.name,description:f.description,price:Number(f.price)};toast('…');
const up=async(bk,file,old)=>{const n=Date.now()+'_'+Math.random().toString(36).slice(2,6)+'_'+file.name.replace(/[^\w.]/g,'_'),r=await sb.storage.from(bk).upload(n,file);if(r.error)throw r.error;if(old)await sb.storage.from(bk).remove([old]);return n};
try{if(cv)data.cover_path=await up('covers',cv,E&&E.cover_path);if(pf)data.pdf_path=await up('pdfs',pf,E&&E.pdf_path);
const r=E?await sb.from('books').update(data).eq('id',E.id):await sb.from('books').insert(data);if(r.error)throw r.error}catch(x){return toast(x.message)}
V.edit=null;V.f=null;V.kind=null;toast(t('done'));await load();render()}
async function delB(id){if(!confirm(t('sure')))return;const b=BK.find(x=>x.id===id);if(b.cover_path)await sb.storage.from('covers').remove([b.cover_path]);if(b.pdf_path)await sb.storage.from('pdfs').remove([b.pdf_path]);const r=await sb.from('books').delete().eq('id',id);if(r.error)return toast(r.error.message);await load();render()}
async function loadAdmin(){const[p,u,s]=await Promise.all([sb.from('payments').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('*').order('created_at',{ascending:false}),sb.rpc('visit_stats')]);
AD.pays=p.data||[];AD.users=u.data||[];AD.prof={};AD.users.forEach(x=>AD.prof[x.id]=x);AD.st=s.data||AD.st;
if(V.v!=='admin')return;if(V.tab==='add'){if($('s1')){$('s1').textContent=AD.st.total;$('s2').textContent=AD.st.uniq;$('s3').textContent=AD.users.length}}else render()}
function rt(){if(RT)return;RT=sb.channel('adm');['visits','profiles','payments'].forEach(tb=>RT.on('postgres_changes',{event:'*',schema:'public',table:tb},()=>loadAdmin()));RT.subscribe()}

/* ---------- core ---------- */
async function load(){BK=(await sb.from('books').select('*').order('created_at',{ascending:false})).data||[];MY=U?((await sb.from('payments').select('*').eq('user_id',U.id)).data||[]):[]}
async function boot(){const s=(await sb.auth.getSession()).data.session;U=s?s.user:null;ADM=false;if(U){const r=await sb.rpc('is_admin');ADM=r.data===true}await load();if(ADM){await loadAdmin();rt()}}
async function visit(){if(ADM||sessionStorage.getItem('v'))return;sessionStorage.setItem('v',1);let id=localStorage.getItem('vid');if(!id){id=crypto.randomUUID();localStorage.setItem('vid',id)}sb.from('visits').insert({vid:id})}
function render(){document.title=t('brand');const v=V.v;$('app').innerHTML=hdr()+`<main>${v==='home'?home():v==='list'?lst():v==='login'?auth(0):v==='signup'?auth(1):v==='pay'?pay():v==='my'&&U?my():v==='admin'&&ADM?admin():home()}</main>`+ftr()}
(async()=>{if(SB_URL.startsWith('YOUR_')){$('app').innerHTML=`<div class="box"><h2>${t('setup')}</h2></div>`;return}
sb=supabase.createClient(SB_URL,SB_KEY);await boot();render();visit()})();
</script></body></html>
