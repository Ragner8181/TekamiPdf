<!DOCTYPE html>
<html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>መጽሐፍ ቤት</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;800&family=Noto+Serif+Ethiopic:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--g:#0d3b2e;--g2:#14543f;--y:#e0a526;--r:#b3261e;--bg:#f2f5f3;--ink:#16211c;--mut:#5d6b64;--ln:#d8e0db}
*{box-sizing:border-box;margin:0}body{font:16px/1.6 "Noto Sans Ethiopic",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit}.w{max-width:1080px;margin:auto;padding:0 16px}
header{background:var(--g);color:#fff;border-bottom:4px solid var(--y)}header .w{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px}
.logo{font:900 22px "Noto Serif Ethiopic",serif;cursor:pointer;margin-right:auto}
nav button,.btn{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;background:var(--y);color:#2a1f00}
nav button{background:transparent;color:#fff}nav button:hover{background:#ffffff22}nav .on{background:#ffffff26}
.btn:hover{filter:brightness(1.08)}.btn.g{background:var(--g2);color:#fff}.btn.r{background:var(--r);color:#fff}.btn.o{background:#fff;border:1px solid var(--ln);color:var(--ink)}
.hero{background:var(--g);color:#fff;padding:48px 0 56px}.hero h1{font:900 clamp(28px,5vw,48px)/1.25 "Noto Serif Ethiopic",serif;max-width:640px}.hero p{margin-top:10px;color:#cfe3da;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;padding:28px 0}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--g2)}.card .b{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font:900 20px/1.3 "Noto Serif Ethiopic",serif}.nm{color:var(--g2);font-weight:600}.d{color:var(--mut);font-size:14px;flex:1}
.pr{font-weight:800;font-size:34px;color:var(--r);line-height:1.1}.pr small{font-size:16px;color:var(--ink)}
.box{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:22px;margin:24px auto;max-width:520px}.box.wd{max-width:none}
.box h2{font:900 24px "Noto Serif Ethiopic",serif;margin-bottom:12px}
input,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:8px;margin:5px 0 12px;background:#fff}
label{font-weight:600;font-size:14px}.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;margin:8px 0;background:var(--bg)}
.row span{color:var(--mut);min-width:96px;font-size:14px}.row b{flex:1;word-break:break-all}.row button{border:0;background:var(--g2);color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.pm button{padding:16px 6px;border:2px solid var(--ln);background:#fff;border-radius:10px;font-weight:800;cursor:pointer}.pm .on{border-color:var(--g2);background:#e6f2ec}
.tag{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700}.pending{background:#fff1cc}.approved{background:#d5f0df}.rejected{background:#fbd9d6}
.it{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln)}
.tabs{display:flex;gap:8px;margin-top:24px}.lk{color:var(--g2);cursor:pointer;text-decoration:underline;background:none;border:0}
footer{background:var(--g);color:#cfe3da;padding:26px 0;margin-top:40px;text-align:center}footer a{color:var(--y)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none}#toast.s{opacity:1}
button:focus-visible,input:focus-visible{outline:3px solid var(--y)}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
// ===== CONFIG: paste from Supabase > Project Settings > API =====
const SB_URL="https://gxkfvwutlgygqmaurngj.supabase.co",SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4a2Z2d3V0bGd5Z3FtYXVybmdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzOTA3NzMsImV4cCI6MjEwNzk2Njc3M30.dM3C8IQU4DB2OWMqnoFW1HOEmvvplSD3371ZOdMocDE";
const TG="Promax81",PH="0975999719",HOLDER="Tsegaye Fikre";
const PAY=[{k:"cbe",n:"CBE",a:"1000626684932"},{k:"tele",n:"Telebirr",a:"0975999719"},{k:"awash",n:"Awash Bank",a:"01335630780600"}];
const T={am:{brand:"መጽሐፍ ቤት",hero:"ዕውቀትን በአንድ ጠቅታ ያግኙ",sub:"ለህይወቶ ጠቃሚ የPDF መጽሐፎችን በመግዛት ህይወቶ ላይ ለውጥ ማየት ጀምሩ።",home:"መነሻ ገፅ",my:"መጽሐፎቼ",admin:"አስተዳዳሪ",login:"ግባ",signup:"አዲስ ለመመዝገብ",logout:"ውጣ",name:"ስም",email:"ኢሜይል",pw:"ፓስዋርድ",pw2:"ፓስዋርድ ድገም",noAcc:"አካውንት የለዎትም? እንደ አዲስ ተመዝገቡ",haveAcc:"አካውንት አለዎት? ይግቡ",mismatch:"ፓስዎርዶቹ አይመሳሰሉም",buy:"አሁኑኑ ለመግዛት",birr:"ብር",noBooks:"እስካሁን ምንም መፅሐፍ አልተለቀቀም",pay:"ክፍያ",choose:"የክፍያ አማራጭ ይምረጡ",accName:"የሂሳብ ስም",accNo:"የሂሳብ ቁጥር",amount:"መጠን",sent:"ክፍያ አስገብቻለሁ",receipt:"የደረሰኝ ወይም የስክሪንሻት ፎቶ",tx:"የግብይት ቁጥር",or:"ወይም",needOne:"ደረሰኝ ወይም የግብይት ቁጥር ያስገቡ",submit:"ላክ",sentOk:"ተልኳል! ክፍያው መግባቱን አረጋግጠን በቅርቡ መፅሀፉን ማውረድ ይችላሉ።",pending:"በመጠባበቅ ላይ",approved:"ፀድቋል",rejected:"ውድቅ ተደርጓል",dl:"መፅሀፉን አውርድ",payments:"ክፍያዎች",upload:"መፅሐፍ ጫን",title:"የመጽሐፉ ርዕስ",bname:"የመጽሐፉ ስም",desc:"መግለጫ",cover:"የሽፋን ምስል",pdf:"PDF ፋይል",publish:"ልቀቅ",approve:"አጽድቅ",reject:"ውድቅ አድርግ",help:"ችግር ካጋጠመዎት ያግኙን",fill:"ሁሉንም መስኮች ይሙሉ",done:"ተሳክቷል",copied:"ተቀድቷል",back:"ተመለስ",none:"ምንም የለም",view:"ደረሰኝ ይመልከቱ",del:"ሰርዝ",mail:"አካውንት ተፈጥሯል። እባክዎ ኢሜይልዎን ያረጋግጡ።",first:"ለመግዛት መጀመሪያ ይግቡ",price:"ዋጋ",book:"መጽሐፍ",sure:"እርግጠኛ ነዎት?",pn:"ስልክ ቁጥር"},
en:{brand:"Book House",hero:"Knowledge, one tap away",sub:"Buy great PDF books and download them as soon as your payment is approved.",home:"Home",my:"My books",admin:"Admin",login:"Log in",signup:"Sign up",logout:"Log out",name:"Name",email:"Email",pw:"Password",pw2:"Repeat password",noAcc:"No account? Sign up",haveAcc:"Have an account? Log in",mismatch:"Passwords do not match",buy:"Buy now",birr:"ETB",noBooks:"No books listed yet",pay:"Payment",choose:"Choose a payment method",accName:"Account name",accNo:"Account number",amount:"Amount",sent:"I have sent the payment",receipt:"Receipt or screenshot",tx:"Transaction number",or:"or",needOne:"Add a receipt or a transaction number",submit:"Submit",sentOk:"Sent! You can download once the admin approves.",pending:"Pending",approved:"Approved",rejected:"Rejected",dl:"Download",payments:"Payments",upload:"Upload book",title:"Book title",bname:"Book name",desc:"Description",cover:"Cover image",pdf:"PDF file",publish:"Publish",approve:"Approve",reject:"Reject",help:"Need help? Contact us",fill:"Fill in all fields",done:"Done",copied:"Copied",back:"Back",none:"Nothing here",view:"View receipt",del:"Delete",mail:"Account created. Please check your email.",first:"Log in first to buy",price:"Price",book:"Book",sure:"Are you sure?",pn:"Phone number"}};
const $=s=>document.querySelector(s);
if(typeof supabase==="undefined"||SB_URL.startsWith("YOUR_")){document.body.innerHTML='<div style="max-width:520px;margin:60px auto;padding:20px;font-family:sans-serif"><h2>Setup needed</h2><p>Paste your Supabase URL and anon key into SB_URL and SB_KEY at the top of index.html, then open the page from your Vercel link. The Claude preview cannot run this site.</p></div>';throw new Error("setup needed")}
const sb=supabase.createClient(SB_URL,SB_KEY);
let L=localStorage.lang||"am",U=null,ADM=false,books=[],P=[],V={n:"home"};
const t=k=>T[L][k]||k,esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString("en-US"),cov=p=>p?sb.storage.from("covers").getPublicUrl(p).data.publicUrl:"";
const clean=f=>Date.now()+"-"+f.name.replace(/[^\w.]/g,"_");
const toast=m=>{const e=$("#toast");e.textContent=m;e.className="s";setTimeout(()=>e.className="",1600)};
const go=async(n,x={})=>{V={n,...x};if(n=="my"||n=="admin")await loadP();render();scrollTo(0,0)};
const lang=()=>{L=L=="am"?"en":"am";localStorage.lang=L;document.documentElement.lang=L;render()};
const cp=v=>navigator.clipboard.writeText(v).then(()=>toast(t("copied")));
const loadBooks=async()=>{books=(await sb.from("books").select("*").order("created_at",{ascending:false})).data||[]};
const loadP=async()=>{P=(await sb.from("payments").select("*,books(title,pdf_path)").order("created_at",{ascending:false})).data||[]};
async function setUser(u){U=u||null;ADM=false;if(U){const r=await sb.from("admins").select("email").eq("email",U.email);ADM=!!(r.data&&r.data.length)}render()}

function head(){const a=n=>V.n==n?"on":"";return `<header><div class=w><div class=logo onclick="go('home')">📖 ${t("brand")}</div><nav>
<button class="${a("home")}" onclick="go('home')">${t("home")}</button>
${U?`<button class="${a("my")}" onclick="go('my')">${t("my")}</button>`:""}${ADM?`<button class="${a("admin")}" onclick="go('admin',{tab:'p'})">${t("admin")}</button>`:""}
<button onclick="lang()">🌐 ${L=="am"?"English":"አማርኛ"}</button>
${U?`<button onclick="sb.auth.signOut();go('home')">${t("logout")}</button>`:`<button onclick="go('auth',{mode:'login'})">${t("login")}</button>`}</nav></div></header>`}
const foot=()=>`<footer><div class=w><p>${t("help")}</p><p>Telegram: <a href="https://t.me/${TG}" target=_blank>@${TG}</a> &nbsp;|&nbsp; ☎ <a href="tel:${PH}">${PH}</a></p></div></footer>`;

function home(){return `<section class=hero><div class=w><h1>${t("hero")}</h1><p>${t("sub")}</p></div></section><div class=w>
${books.length?`<div class=grid>${books.map(b=>`<article class=card>${b.cover_path?`<img src="${cov(b.cover_path)}" alt="">`:`<div class=ph></div>`}
<div class=b><h3>${esc(b.title)}</h3><div class=nm>${esc(b.name)}</div><p class=d>${esc(b.description)}</p>
<div class=pr>${fmt(b.price)} <small>${t("birr")}</small></div><button class=btn onclick="buy('${b.id}')">${t("buy")}</button></div></article>`).join("")}</div>`:`<p style="padding:40px 0">${t("noBooks")}</p>`}</div>`}
function buy(id){if(!U){toast(t("first"));return go("auth",{mode:"login",next:id})}go("pay",{id,m:null,sent:false})}

function auth(){const s=V.mode=="signup";return `<div class=w><form class=box onsubmit="doAuth(event)"><h2>${s?t("signup"):t("login")}</h2>
${s?`<label>${t("name")}</label><input id=an required>`:""}<label>${t("email")}</label><input id=ae type=email required>
<label>${t("pw")}</label><input id=ap type=password minlength=6 required>${s?`<label>${t("pw2")}</label><input id=ap2 type=password minlength=6 required>`:""}
<button class="btn" style="width:100%">${s?t("signup"):t("login")}</button><p style="margin-top:14px"><button type=button class=lk onclick="go('auth',{mode:'${s?"login":"signup"}',next:V.next})">${s?t("haveAcc"):t("noAcc")}</button></p>
<p style="margin-top:10px;color:var(--mut);font-size:14px">${t("help")}: @${TG} · ${PH}</p></form></div>`}
async function doAuth(e){e.preventDefault();const em=$("#ae").value.trim(),pw=$("#ap").value,s=V.mode=="signup",nx=V.next;let r;
 if(s){if(pw!=$("#ap2").value)return toast(t("mismatch"));r=await sb.auth.signUp({email:em,password:pw,options:{data:{name:$("#an").value.trim()}}});if(!r.error&&!r.data.session)return toast(t("mail"))}
 else r=await sb.auth.signInWithPassword({email:em,password:pw});
 if(r.error)return toast(r.error.message);await setUser(r.data.user);nx?buy(nx):go("home")}

function pay(){const b=books.find(x=>x.id==V.id),m=PAY.find(x=>x.k==V.m);if(!b)return "";
 const R=(l,v,c=1)=>`<div class=row><span>${l}</span><b>${esc(v)}</b>${c?`<button onclick="cp('${v}')" title="Copy" aria-label="Copy">⧉</button>`:""}</div>`;
 return `<div class=w><div class=box><button class=lk onclick="go('home')">← ${t("back")}</button><h2>${esc(b.title)}</h2><div class=pr>${fmt(b.price)} <small>${t("birr")}</small></div>
<p style="margin-top:14px;font-weight:600">${t("choose")}</p><div class=pm>${PAY.map(x=>`<button class="${V.m==x.k?"on":""}" onclick="V.m='${x.k}';V.sent=false;render()">${x.n}</button>`).join("")}</div>
${m?`${R(t("accName"),HOLDER)}${R(m.k=="tele"?t("pn"):t("accNo"),m.a)}${R(t("amount"),fmt(b.price)+" "+t("birr"),0)}
${V.sent?`<hr style="margin:18px 0;border:0;border-top:1px solid var(--ln)"><label>${t("receipt")}</label><input id=rc type=file accept="image/*,.pdf"><p style="text-align:center;color:var(--mut)">— ${t("or")} —</p>
<label>${t("tx")}</label><input id=tx><button class="btn g" style="width:100%" onclick="sendPay(this)">${t("submit")}</button>`:`<button class="btn" style="width:100%;margin-top:10px" onclick="V.sent=true;render()">${t("sent")}</button>`}`:""}
<p style="margin-top:14px;color:var(--mut);font-size:14px">${t("help")}: @${TG} · ${PH}</p></div></div>`}
async function sendPay(btn){const f=$("#rc").files[0],tx=$("#tx").value.trim();if(!f&&!tx)return toast(t("needOne"));btn.disabled=true;let rp=null;
 if(f){rp=U.id+"/"+clean(f);const u=await sb.storage.from("receipts").upload(rp,f);if(u.error){btn.disabled=false;return toast(u.error.message)}}
 const r=await sb.from("payments").insert({book_id:V.id,method:V.m,tx_number:tx||null,receipt_path:rp,user_name:U.user_metadata?.name,user_email:U.email});
 if(r.error){btn.disabled=false;return toast(r.error.message)}alert(t("sentOk"));go("my")}

const st=s=>`<span class="tag ${s}">${t(s)}</span>`;
function my(){const l=P.filter(p=>p.user_id==U.id);return `<div class=w><div class="box wd"><h2>${t("my")}</h2>${l.length?l.map(p=>`<div class=it><div><b>${esc(p.books?.title)}</b><br>${st(p.status)}</div>
${p.status=="approved"?`<button class="btn g" onclick="dl('${p.books.pdf_path}')">⬇ ${t("dl")}</button>`:""}</div>`).join(""):t("none")}</div></div>`}
async function dl(p){const r=await sb.storage.from("pdfs").createSignedUrl(p,120,{download:true});r.error?toast(r.error.message):location.href=r.data.signedUrl}

function admin(){const p=V.tab=="p";return `<div class=w><div class=tabs><button class="btn ${p?"g":"o"}" onclick="go('admin',{tab:'p'})">${t("payments")}</button><button class="btn ${p?"o":"g"}" onclick="go('admin',{tab:'u'})">${t("upload")}</button></div>
<div class="box wd">${p?(P.length?P.map(x=>`<div class=it><div><b>${esc(x.books?.title)}</b> — ${esc(x.method)}<br>${esc(x.user_name)} · ${esc(x.user_email)}<br>${x.tx_number?`${t("tx")}: <b>${esc(x.tx_number)}</b><br>`:""}
${x.receipt_path?`<button class=lk onclick="rcpt('${x.receipt_path}')">${t("view")}</button><br>`:""}${st(x.status)}</div>
<div><button class="btn g" onclick="setSt('${x.id}','approved')">${t("approve")}</button> <button class="btn r" onclick="setSt('${x.id}','rejected')">${t("reject")}</button></div></div>`).join(""):t("none"))
:`<h2>${t("upload")}</h2><label>${t("title")}</label><input id=bt><label>${t("bname")}</label><input id=bn><label>${t("desc")}</label><textarea id=bd rows=4></textarea>
<label>${t("price")} (${t("birr")})</label><input id=bpr type=number min=1><label>${t("cover")}</label><input id=bc type=file accept="image/*"><label>${t("pdf")}</label><input id=bp type=file accept=".pdf">
<button class=btn onclick="publish(this)">${t("publish")}</button><hr style="margin:22px 0;border:0;border-top:1px solid var(--ln)">${books.map(b=>`<div class=it><b>${esc(b.title)}</b><button class="btn r" onclick="delBook('${b.id}')">${t("del")}</button></div>`).join("")}`}</div></div>`}
async function rcpt(p){const w=window.open("","_blank"),r=await sb.storage.from("receipts").createSignedUrl(p,300);r.error?(w.close(),toast(r.error.message)):w.location=r.data.signedUrl}
async function setSt(id,s){const r=await sb.from("payments").update({status:s}).eq("id",id);if(r.error)return toast(r.error.message);await loadP();render()}
async function publish(btn){const g=i=>$("#"+i).value.trim(),c=$("#bc").files[0],f=$("#bp").files[0];if(!g("bt")||!g("bn")||!g("bpr")||!c||!f)return toast(t("fill"));btn.disabled=true;
 const cp_=clean(c),fp=clean(f);let e=(await sb.storage.from("covers").upload(cp_,c)).error||(await sb.storage.from("pdfs").upload(fp,f)).error;
 if(!e)e=(await sb.from("books").insert({title:g("bt"),name:g("bn"),description:g("bd"),price:+g("bpr"),cover_path:cp_,pdf_path:fp})).error;
 if(e){btn.disabled=false;return toast(e.message)}await loadBooks();toast(t("done"));go("admin",{tab:"u"})}
async function delBook(id){if(!confirm(t("sure")))return;const b=books.find(x=>x.id==id);await sb.from("books").delete().eq("id",id);
 if(b){await sb.storage.from("pdfs").remove([b.pdf_path]);await sb.storage.from("covers").remove([b.cover_path])}await loadBooks();render()}

function render(){const v={home,auth,pay,my,admin}[V.n];$("#app").innerHTML=head()+v()+foot();document.title=t("brand")}
(async()=>{await loadBooks();const s=(await sb.auth.getSession()).data.session;await setUser(s?.user);sb.auth.onAuthStateChange((_,x)=>{if((x?.user?.id||null)!=(U?.id||null))setUser(x?.user)})})();
</script></body></html>
